# JVM args for the Gradle daemon. 4 GB is comfortable for AGP 8 + KSP + Hilt;
# bump to 6g if your IDE struggles during incremental builds.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX + Kotlin code style (kept consistent with the web side)
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP runs in legacy (KSP1) mode. KSP2 support in Hilt's annotation processor
# only landed in Hilt 2.55+; while we're on 2.52 we must keep KSP1 or the
# processor silently no-ops and emits "Expected @HiltAndroidApp to have a
# value" at compile time. Re-enable when bumping Hilt.
ksp.useKSP2=false
